<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mikoshi Portal — Shop CRM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="supabase-js.min.js"></script>
<style>
  :root {
    --bg: #0b0d10; --surface: #12151a; --surface2: #171b21;
    --ink: #e9e7e2; --muted: #8b9099; --line: #232830;
    --accent: #35e0ff; --accent2: #ff3d81;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --sans: "Space Grotesk", -apple-system, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .mono { font-family: var(--mono); }

  /* ---------- login ---------- */
  #login-view {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background-image: linear-gradient(rgba(53,224,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(53,224,255,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .login-card {
    width: 380px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 8px; padding: 40px; position: relative;
  }
  .login-card::before {
    content: ""; position: absolute; top: -1px; left: -1px;
    width: 14px; height: 14px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent);
  }
  .login-card .brand { font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: 0.06em; margin-bottom: 6px; }
  .login-card .brand b { color: var(--accent); font-weight: 500; }
  .login-card .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 28px; }
  .login-card label { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 6px; }
  .login-card input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    color: var(--ink); font-family: var(--mono); font-size: 14px; padding: 10px 12px; outline: none;
  }
  .login-card input:focus { border-color: var(--accent); }
  .btn {
    display: inline-block; padding: 12px 20px; border-radius: 4px; border: none; cursor: pointer;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #0b0d10; width: 100%; margin-top: 24px; }
  .btn-primary:hover { background: #7deeff; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
  .err { color: var(--accent2); font-family: var(--mono); font-size: 12px; margin-top: 12px; min-height: 16px; }

  /* ---------- app ---------- */
  #app-view { display: none; }
  header {
    position: sticky; top: 0; z-index: 50; background: rgba(11,13,16,0.95);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  .nav { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: var(--mono); font-weight: 500; font-size: 14px; letter-spacing: 0.08em; }
  .wordmark b { color: var(--accent); font-weight: 500; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-right .who { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }

  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar input[type=text], .toolbar select {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 9px 12px; outline: none;
  }
  .toolbar input[type=text]:focus, .toolbar select:focus { border-color: var(--accent); }
  .toolbar input[type=text] { flex: 1; min-width: 200px; }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }

  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); text-align: left; padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  tr:hover td { background: var(--surface); }
  .shop-name { font-weight: 500; }
  .shop-email a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 12px; }
  .shop-email a:hover { text-decoration: underline; }
  .shop-phone { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status-pill {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line);
  }
  .st-prospect { color: var(--muted); }
  .st-emailed { color: var(--accent); border-color: var(--accent); }
  .st-samples { color: #ffd166; border-color: #ffd166; }
  .st-order { color: #6ee7a0; border-color: #6ee7a0; }
  .st-dead { color: var(--accent2); border-color: var(--accent2); }
  .notes-cell { font-size: 12px; color: var(--muted); max-width: 220px; }
  .notes-cell input {
    width: 100%; background: transparent; border: 1px solid transparent; border-radius: 3px;
    color: var(--muted); font-size: 12px; padding: 4px 6px; font-family: var(--sans); outline: none;
  }
  .notes-cell input:focus { border-color: var(--accent); color: var(--ink); background: var(--bg); }
  .pager { display: flex; gap: 12px; align-items: center; justify-content: center; margin-top: 24px; }
  .pager .pg { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 60px 0; }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--surface2);
    border: 1px solid var(--accent); border-radius: 6px; padding: 12px 18px;
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    opacity: 0; transform: translateY(8px); transition: all 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view">
  <div class="login-card">
    <div class="brand">MIKOSHI<b>▸</b>PORTAL</div>
    <div class="sub">Shop CRM · Restricted</div>
    <label>Email</label>
    <input type="email" id="login-email" autocomplete="username" placeholder="admin@mikoshigear.ca">
    <label>Password</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-primary" id="login-btn">Enter</button>
    <div class="err" id="login-err"></div>
    <div class="err" id="boot-status" style="color:#4d545e">…</div>
  </div>
</div>

<!-- APP -->
<div id="app-view">
  <header>
    <div class="nav">
      <span class="wordmark">MIKOSHI<b>▸</b>PORTAL</span>
      <div class="nav-right">
        <span class="who" id="whoami"></span>
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="toolbar">
      <input type="text" id="search" placeholder="Search name / city / email…">
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="prospect">Prospect</option>
        <option value="emailed">Emailed</option>
        <option value="samples">Samples</option>
        <option value="order">Order</option>
        <option value="dead">Dead</option>
      </select>
      <select id="email-filter">
        <option value="">All shops</option>
        <option value="has">Has email</option>
        <option value="none">No email</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Shop</th><th>Contact</th><th>Status</th><th>Notes</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No shops match.</div>
    <div class="pager">
      <button class="btn btn-ghost" id="prev">◂ Prev</button>
      <span class="pg" id="pageinfo"></span>
      <button class="btn btn-ghost" id="next">Next ▸</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="portal.js"></script>
</body>
</html>
