<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 751" width="736" height="751">
  <rect width="736" height="751" fill="#12151a"/>
  <!-- coiled cable -->
  <g fill="none" stroke="#2a303a" stroke-width="14">
    <path d="M368 640 C 200 640, 140 540, 200 440 C 260 340, 560 340, 620 440 C 680 540, 560 640, 368 640"/>
    <path d="M368 640 C 240 640, 180 560, 230 475 C 280 390, 520 390, 570 475 C 620 560, 520 640, 368 640"/>
  </g>
  <g fill="none" stroke="#35e0ff" stroke-width="16" stroke-linecap="round">
    <path d="M368 640 C 200 640, 140 540, 200 440 C 260 340, 560 340, 620 440 C 680 540, 560 640, 368 640"/>
  </g>
  <!-- braid dots -->
  <g fill="#e9e7e2">
    <circle cx="220" cy="500" r="4"/><circle cx="280" cy="420" r="4"/><circle cx="368" cy="370" r="4"/>
    <circle cx="460" cy="420" r="4"/><circle cx="520" cy="500" r="4"/><circle cx="470" cy="600" r="4"/>
    <circle cx="300" cy="600" r="4"/>
  </g>
  <!-- top connector -->
  <rect x="318" y="90" width="100" height="120" rx="18" fill="#1b2027"/>
  <rect x="348" y="70" width="40" height="30" rx="6" fill="#171b21"/>
  <rect x="348" y="70" width="40" height="12" rx="6" fill="#35e0ff" opacity="0.8"/>
  <!-- bottom connector -->
  <rect x="318" y="620" width="100" height="120" rx="18" fill="#1b2027"/>
  <rect x="348" y="730" width="40" height="30" rx="6" fill="#171b21"/>
  <rect x="348" y="748" width="40" height="12" rx="6" fill="#35e0ff" opacity="0.8"/>
  <!-- E-marker label -->
  <text x="368" y="560" text-anchor="middle" font-family="monospace" font-size="24" fill="#35e0ff" letter-spacing="4">E-MARKER</text>
  <text x="368" y="600" text-anchor="middle" font-family="monospace" font-size="20" fill="#8b9099" letter-spacing="6">100W · 5A</text>
  <!-- length ticks -->
  <text x="368" y="170" text-anchor="middle" font-family="monospace" font-size="18" fill="#4d545e" letter-spacing="3">1M / 2M / 3M</text>
</svg>
